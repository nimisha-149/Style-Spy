<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{width:390px;margin:0;padding:16px;background:#f5f6fb;color:#20263a;font:13px Arial,sans-serif}
h2{margin:0;color:#273c83;font-size:21px}p{color:#667085;margin:5px 0 13px}
button,input{font:inherit;border:1px solid #d4d9e5;border-radius:8px;padding:8px}
button{cursor:pointer;background:#4059c8;color:white;border:0;font-weight:700}
.row{display:flex;gap:7px;margin:9px 0}.row input{flex:1;min-width:0}
h3{font-size:14px;margin:16px 0 8px}.item{display:flex;align-items:center;gap:8px;background:white;padding:8px;border-radius:8px;margin:6px 0;box-shadow:0 1px 4px #18234a0d}
.swatch{width:26px;height:26px;border-radius:6px;border:1px solid #ccd2df;flex:none}
.info{flex:1;min-width:0;overflow-wrap:anywhere}.muted{color:#778197;font-size:11px}
.item button{padding:6px 8px;font-size:11px}.wide{width:100%;margin-top:7px}
#message{min-height:16px;color:#18794e;font-size:11px;margin-top:8px}
#kits{max-height:130px;overflow:auto}.kitrow{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:7px;padding:7px;margin:5px 0;gap:6px}
</style></head><body>
<h2>Style Spy</h2><p>Inspect the current page and collect its visual style.</p>
<button class="wide" id="scan">Scan this website</button>
<div id="message"></div>
<h3>Main colours <span class="muted">(ranked by visible usage)</span></h3><div id="colours"><div class="muted">Scan a page to view colours.</div></div>
<h3>Typography</h3><div id="fonts"><div class="muted">Scan a page to view fonts.</div></div>
<div class="row"><input id="kitName" placeholder="Name this style kit"><button id="save">Save kit</button></div>
<h3>Saved kits</h3><div id="kits"></div>
<button class="wide" id="export">Export selected scan as CSS</button>
<script src="popup.js"></script></body></html>
